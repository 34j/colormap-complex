[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "colormap-complex"
version = "0.2.0"
description = "Complex / 2d colormap / Domain coloring for matplotlib etc."
readme = "README.md"
license = "Apache-2.0"
authors = [ { name = "34j" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "colour-science>=0.4.4",
  "pytest-xdist>=3.6.1",
]
urls."Bug Tracker" = "https://github.com/34j/colormap-complex/issues"
urls.Changelog = "https://github.com/34j/colormap-complex/blob/main/CHANGELOG.md"
urls.documentation = "https://colormap-complex.readthedocs.io"
urls.repository = "https://github.com/34j/colormap-complex"

[dependency-groups]
dev = [
  "coverage",
  "matplotlib>=3.10.1",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "python-slugify>=8.0.4",
  "scipy>=1.13.1",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.setuptools]
package-data.colormap_complex = [ "**/*.npy" ]
packages.find.where = [ "src" ]

[tool.ruff]
extend = ".venv/ruff.toml"
format.exclude = [ "docs/conf.py" ]
lint.per-file-ignores."docs/conf.py" = [ "A001", "D401" ]
lint.per-file-ignores."src/colormap_complex/_main.py" = [ "A002", "C901", "DOC501", "PLR6201", "UP047" ]
lint.per-file-ignores."src/colormap_complex/matplotlib.py" = [ "N803", "TC001" ]
lint.per-file-ignores."tests/**/*" = [ "A001", "A002", "PLW0108", "PT006" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
ini_options.addopts = """\
    -v
    -Wdefault
    --cov=colormap_complex
    --cov-report=term
    --cov-report=xml
    """
ini_options.pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version" ]
build_command = """
pip install uv
uv lock
git add uv.lock
uv build
"""
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
changelog.environment.keep_trailing_newline = true
